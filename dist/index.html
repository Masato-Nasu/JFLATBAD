  <style>:root {
  color-scheme: light;
  --ink: #182a3e;
  --navy: #172f50;
  --blue: #18477a;
  --link: #194e86;
  --muted: #52647a;
  --rule: #cbd6df;
  --soft-rule: #dbe4eb;
  --paper: #fff;
  --canvas: #f6f8fa;
  --tint: #eaf2f8;
  --red: #8e3e36;
  --green: #2b604d;
  --radius: 3px;
  --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --sans: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, "Noto Sans CJK JP", sans-serif;
}

* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  min-height: 100vh;
  margin: 0;
  display: flex;
  flex-direction: column;
  background: var(--canvas);
  color: var(--ink);
  font: 1rem/1.65 var(--sans);
  overflow-wrap: anywhere;
}
input, button, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
a { color: var(--link); text-underline-offset: .19em; }
a:hover { color: var(--navy); }
:focus-visible { outline: 3px solid #477fbb; outline-offset: 3px; }
h1, h2, h3, p, dl, dd { margin: 0; }
h1, h2, h3 { line-height: 1.4; }
h1 { color: var(--navy); font-size: clamp(1.65rem, 4vw, 2.12rem); letter-spacing: .015em; }
h2 { color: var(--navy); font-size: 1.2rem; }
h3 { color: var(--navy); font-size: 1rem; }
[hidden] { display: none !important; }
.wrap { width: min(72.5rem, calc(100% - 3.5rem)); margin-inline: auto; }
.main { flex: 1 0 auto; padding-block: 2.45rem 3.9rem; }
.main:focus { outline: none; }
.sr-only, .skip-link:not(:focus) {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap; border: 0;
}
.skip-link:focus { position: fixed; inset: .5rem auto auto .5rem; z-index: 5; padding: .55rem .8rem; background: white; }
.mono, .date, .record-number { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.date { color: var(--muted); font-size: .8125rem; white-space: nowrap; }
.hint { font-size: .875rem; color: var(--muted); }

.masthead { border-top: .25rem solid var(--navy); background: var(--paper); }
.mast-inner { display: flex; align-items: center; justify-content: space-between; min-height: 5.15rem; gap: 1rem; }
.brand { display: inline-flex; align-items: center; gap: .75rem; color: var(--navy); text-decoration: none; flex: 0 0 auto; }
.brand-mark {
  position: relative; flex: 0 0 auto; width: 2.65rem; height: 2.65rem; background: var(--navy);
  border-radius: 2px;
}
.brand-mark::before, .brand-mark::after { content: ""; position: absolute; }
.brand-mark::before {
  left: 23%; top: 22%; width: 53%; height: 55%;
  background: linear-gradient(white, white) 0 0 / 100% 2px no-repeat,
              linear-gradient(white, white) 0 0 / 2px 100% no-repeat,
              linear-gradient(white, white) 0 100% / 57% 2px no-repeat;
}
.brand-mark::after { inset: 43% 24% 34% 49%; border-top: 2px solid white; border-right: 2px solid white; }
.brand-type { display: flex; flex-direction: column; justify-content: center; }
.wordmark { font-size: 2.15rem; font-weight: 800; line-height: .98; letter-spacing: -.065em; }
.subtitle { color: var(--muted); font-size: .75rem; letter-spacing: .02em; line-height: 1.3; margin-top: .32rem; }
.mast-actions { display: flex; align-items: center; gap: 1.25rem; }
.agency-id { display: flex; align-items: center; gap: .6rem; color: var(--navy); text-decoration: none; }
.agency-seal {
  display: grid; place-items: center; width: 2.25rem; height: 2.25rem;
  border: 1px solid #987454; outline: 1px solid #987454; outline-offset: -4px;
  color: #7e583a; background: #fcfaf6; font-weight: 800; font-size: 1.04rem; line-height: 1;
}
.agency-name { display: grid; font-size: 1rem; font-weight: 750; white-space: nowrap; line-height: 1.24; }
.agency-name small { margin-top: .24rem; color: var(--muted); font-size: .67rem; letter-spacing: .08em; font-weight: 500; }
.button {
  display: inline-flex; justify-content: center; align-items: center; gap: .55rem;
  min-height: 2.75rem; padding: .48rem .95rem; border: 1px solid transparent;
  border-radius: var(--radius); text-decoration: none; font-size: .9375rem; line-height: 1.35;
  font-weight: 700; text-align: center;
}
.button-primary { color: white; background: var(--navy); border-color: var(--navy); }
.button-primary:hover, .button-primary:focus-visible { color: white; background: #204671; }
.button-secondary { color: var(--navy); background: var(--paper); border-color: #9aacbf; }
.button-secondary:hover { background: #f0f5fa; }
.button-text { color: var(--link); background: transparent; text-decoration: underline; text-underline-offset: .2em; }
.button-text:hover { background: #edf3f9; }
.api-button { white-space: nowrap; min-height: 2.42rem; font-size: .875rem; padding-inline: .74rem; }
.api-button[data-configured="true"] .icon-key { color: var(--green); }
.navbar { background: var(--navy); color: white; }
.nav-inner { display: flex; align-items: stretch; }
.nav-item {
  display: inline-flex; align-items: center; justify-content: center; text-align: center;
  min-height: 2.74rem; border-bottom: 3px solid transparent; padding: .4rem 1.35rem .27rem;
  color: #e7eff6; text-decoration: none; white-space: nowrap; font-size: .875rem; font-weight: 650;
}
.nav-item:hover, .nav-item:focus-visible { color: white; background: #274769; }
.nav-item[aria-current="page"] { color: white; border-bottom-color: #97bfdc; background: #264565; }
.disclaimer { background: #eef2f5; color: #415368; border-bottom: 1px solid var(--soft-rule); }
.disclaimer .wrap { display: flex; align-items: center; gap: .65rem; min-height: 2.47rem; padding-block: .38rem; font-size: .8125rem; }
.disclaimer strong {
  flex-shrink: 0; padding: .05rem .34rem; border: 1px solid #acbecd; border-radius: 2px;
  background: #f9fbfc; font-size: .75rem; line-height: 1.5; color: #324c64;
}
.page-title { margin-bottom: 1.4rem; }
.page-title p { color: var(--muted); margin-top: .45rem; }
.home-title { margin-bottom: 1.55rem; }
.home-workspace { display: grid; grid-template-columns: minmax(0, 1.64fr) minmax(0, 1fr); gap: 1.3rem; align-items: stretch; }

.search-panel {
  position: relative; min-width: 0; background: var(--tint); padding: 1.25rem 1.45rem 1.25rem;
  border: 1px solid #bdcfdf; border-top: 3px solid #356a9b; border-radius: var(--radius);
}
.section-top { display: flex; align-items: center; justify-content: space-between; gap: .6rem; padding-bottom: .7rem; border-bottom: 1px solid #c3d4e3; margin-bottom: .86rem; }
.section-top h2, .section-top strong { display: flex; align-items: center; gap: .63rem; }
.section-top a { font-size: .8125rem; text-decoration: none; }
.section-top a:hover { text-decoration: underline; }
.search-form fieldset { border: 0; padding: 0; margin: 0 0 .78rem; min-width: 0; }
.search-form legend, .search-label, .setting-field label { font-size: .875rem; font-weight: 700; }
.choices { display: flex; flex-wrap: wrap; align-items: center; gap: .15rem 1rem; }
.choice { display: inline-flex; align-items: center; min-height: 2.35rem; gap: .44rem; white-space: nowrap; cursor: pointer; font-size: .9375rem; }
.choice input { accent-color: #285d92; width: 1.04rem; height: 1.04rem; margin: 0; }
.search-label { display: block; margin-bottom: .33rem; }
.search-input, .setting-field input, .setting-field select {
  width: 100%; min-height: 3rem; padding: .5rem .8rem; background: var(--paper);
  border: 1px solid #9eb2c4; border-radius: var(--radius); color: var(--ink); font-size: 1rem;
}
input::placeholder { color: #627587; opacity: 1; }
.search-input[aria-invalid="true"] { border-color: var(--red); }
.search-error { color: var(--red); font-size: .875rem; margin-top: .32rem; }
.search-actions { display: grid; grid-template-columns: 1fr .73fr; gap: .65rem; margin-top: .98rem; }
.search-actions .button { min-height: 2.9rem; }
.search-examples { display: flex; align-items: center; flex-wrap: wrap; margin: .46rem 0 0; gap: .15rem .4rem; font-size: .8125rem; color: var(--muted); }
.search-examples button {
  min-height: 2.25rem; border: 0; padding: .12rem .42rem; border-radius: var(--radius);
  background: transparent; color: var(--link); font-size: .875rem; text-decoration: underline; text-underline-offset: .2em;
}
.search-examples button:hover { background: #dce9f3; }
.key-guide { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .55rem .75rem; }
.key-guide > div, .key-guide > p { flex: 1 1 16rem; }
.key-guide .button { white-space: nowrap; min-height: 2.5rem; font-size: .875rem; }
.key-guide-message { font-size: .875rem; font-weight: 650; color: var(--navy); }
.key-guide-note { margin-top: .16rem; font-size: .8125rem; color: var(--muted); }
.search-source { margin-top: .7rem; padding-top: .68rem; border-top: 1px solid #c9d9e5; }
.result-key-guide {
  background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius);
  margin-bottom: .9rem; padding: .55rem .85rem;
}

.notice-panel { background: var(--paper); border: 1px solid #e0c9c3; border-top: 3px solid #9a4b41; border-radius: var(--radius); overflow: hidden; }
.notice-head {
  display: flex; align-items: center; justify-content: space-between; gap: .6rem;
  background: #fcf3ef; padding: .76rem 1rem; border-bottom: 1px solid #ead8d1;
}
.notice-head h2 { color: #6f332d; display: flex; align-items: center; gap: .54rem; }
.notice-head a { font-size: .8125rem; white-space: nowrap; }
.notice-list { list-style: none; margin: 0; padding: 0 1rem; }
.notice-list li { padding: .68rem 0 .72rem; }
.notice-list li + li { border-top: 1px solid var(--soft-rule); }
.notice-meta { display: flex; align-items: center; gap: .64rem; margin-bottom: .19rem; }
.notice-list a { line-height: 1.55; font-size: .92rem; }
.badge {
  display: inline-block; padding: .07rem .42rem; border: 1px solid #c4d2de; border-radius: 2px;
  background: #eef3f7; color: #32506b; font-size: .78rem; font-weight: 650; line-height: 1.5; white-space: nowrap;
}
.badge-important, .badge-rejected { color: #823730; background: #faf0ed; border-color: #ddbeb6; }
.badge-pending { color: #684817; background: #f8f2e5; border-color: #e1d3ad; }
.badge-approved { color: #285a49; background: #ecf4ef; border-color: #c0d6c9; }
.badge-model { color: #315d6b; background: #edf5f5; border-color: #c2d6d9; }
.badge-patent { color: #264d79; background: #eef3fb; border-color: #bfcee1; }

.related-section { margin-top: 2rem; }
.section-heading { display: flex; align-items: center; gap: .56rem; border-bottom: 1px solid #bac9d6; padding-bottom: .57rem; margin-bottom: .9rem; }
.banners { list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .72rem; margin: 0; padding: 0; }
.banner {
  display: flex; align-items: center; min-height: 5.3rem; height: 100%; padding: .66rem .64rem .66rem .73rem; gap: .56rem;
  border: 1px solid var(--rule); border-left: 3px solid var(--tile-ink); border-radius: var(--radius);
  background: var(--paper); color: var(--navy); text-decoration: none;
}
.banner:hover { border-color: var(--tile-ink); background: var(--tile-bg); }
.banner-symbol {
  width: 2.13rem; height: 2.13rem; flex: 0 0 auto; display: grid; place-items: center; color: var(--tile-ink);
  background: var(--tile-bg); border: 1px solid color-mix(in srgb, var(--tile-ink) 26%, white); border-radius: 2px;
}
.banner strong, .banner small { display: block; }
.banner strong { font-size: .9rem; font-weight: 750; line-height: 1.45; }
.banner small { color: var(--muted); margin-top: .23rem; font-size: .75rem; line-height: 1.4; }
.tone-blue { --tile-ink: #355f90; --tile-bg: #eef3fa; }
.tone-rust { --tile-ink: #935a4b; --tile-bg: #f8efeb; }
.tone-olive { --tile-ink: #5a693b; --tile-bg: #f0f3e8; }
.tone-teal { --tile-ink: #386975; --tile-bg: #ebf4f5; }
.tone-umber { --tile-ink: #846538; --tile-bg: #f6f0e6; }
.tone-slate { --tile-ink: #526f81; --tile-bg: #edf3f6; }
.tone-steel { --tile-ink: #51617a; --tile-bg: #eef1f6; }
.tone-plum { --tile-ink: #695b7e; --tile-bg: #f3eff8; }

.icon { display: inline-block; position: relative; width: 1.05rem; height: 1.05rem; flex: 0 0 auto; vertical-align: -.1em; }
.icon::before, .icon::after { position: absolute; box-sizing: border-box; }
.icon-search::before { content: ""; width: 72%; height: 72%; border: 1.7px solid currentColor; border-radius: 50%; inset: 0 auto auto 0; }
.icon-search::after { content: ""; width: 46%; height: 1.7px; background: currentColor; left: 57%; top: 69%; transform: rotate(46deg); }
.icon-random { border: 1.5px solid currentColor; border-radius: 2px; background:
  radial-gradient(circle at 29% 29%, currentColor 0 1px, transparent 1.5px),
  radial-gradient(circle at 71% 71%, currentColor 0 1px, transparent 1.5px),
  radial-gradient(circle at 50% 50%, currentColor 0 1px, transparent 1.5px); }
.icon-key::before { content: ""; width: 58%; height: 58%; border: 1.6px solid currentColor; border-radius: 50%; top: 7%; left: 0; }
.icon-key::after { content: ""; width: 54%; height: 30%; border-top: 1.6px solid currentColor; border-right: 2px solid currentColor; top: 62%; left: 45%; transform: rotate(43deg); }
.icon-alert, .icon-help { border: 1.5px solid currentColor; border-radius: 50%; display: inline-grid; place-items: center; }
.icon-alert::before, .icon-help::before { position: static; content: "!"; font: 750 .76rem/1 var(--sans); }
.icon-help::before { content: "?"; }
.icon-rules, .icon-file { border: 1.5px solid currentColor; border-radius: 1px; background:
  linear-gradient(currentColor, currentColor) 50% 30% / 62% 1px no-repeat,
  linear-gradient(currentColor, currentColor) 50% 53% / 62% 1px no-repeat,
  linear-gradient(currentColor, currentColor) 29% 76% / 38% 1px no-repeat; }
.icon-file { width: .85rem; }
.icon-chart { border-bottom: 1.5px solid currentColor; border-left: 1.5px solid currentColor; background:
  linear-gradient(currentColor, currentColor) 20% 100% / 15% 43% no-repeat,
  linear-gradient(currentColor, currentColor) 53% 100% / 15% 70% no-repeat,
  linear-gradient(currentColor, currentColor) 86% 100% / 15% 90% no-repeat; }
.icon-files, .icon-folder { border: 1.5px solid currentColor; border-radius: 1px; height: .83rem; margin-top: .18rem; }
.icon-files::before, .icon-folder::before { content: ""; inset: -5px 2px auto 0; height: 4px; border: 1.4px solid currentColor; border-bottom: 0; }
.icon-folder::before { right: 48%; }
.icon-grid { border: 1.5px solid currentColor; background:
  linear-gradient(currentColor, currentColor) 50% 0 / 1px 100% no-repeat,
  linear-gradient(currentColor, currentColor) 0 50% / 100% 1px no-repeat; }
.icon-agency { border: 3px double currentColor; }

.footer { border-top: 1px solid #c7d3de; background: #eaf0f5; color: #475b70; }
.footer-inner { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; padding-block: 1.26rem 1.35rem; }
.footer-name { font-weight: 750; font-size: .9375rem; color: var(--navy); }
.footer-disclaimer { font-size: .8125rem; margin-top: .18rem; }
.footer-links { display: flex; align-items: center; flex-wrap: wrap; gap: .28rem .95rem; font-size: .8125rem; list-style: none; margin: 0; padding: 0; }
.footer-links a { white-space: nowrap; }
.footer-motto { color: #52657a; font-size: .75rem; margin-top: .46rem; letter-spacing: .03em; }

.crumbs { margin: -.75rem 0 .95rem; }
.crumbs ol { list-style: none; display: flex; flex-wrap: wrap; gap: .28rem; padding: 0; margin: 0; font-size: .8125rem; color: var(--muted); }
.crumbs li + li::before { content: "/"; padding-inline: .24rem .48rem; color: #677b90; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.result-head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: .6rem 1.25rem; margin-bottom: 1rem; }
.result-head .page-title { margin-bottom: 0; }
.result-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.result-conditions {
  display: flex; flex-wrap: wrap; align-items: center; gap: .42rem 1.35rem; margin-bottom: .9rem;
  padding: .67rem .86rem; border: 1px solid var(--rule); background: var(--tint); border-radius: var(--radius);
}
.result-conditions div { display: flex; align-items: baseline; gap: .55rem; }
.result-conditions dt { color: var(--muted); font-size: .8125rem; }
.result-conditions dd { font-size: .938rem; font-weight: 650; }
.result-conditions .result-count { margin-inline-start: auto; color: var(--navy); }
.result-count b { font-size: 1.08rem; font-family: var(--mono); }
.result-list { padding: 0; margin: 0; list-style: none; border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); background: var(--paper); }
.result-labels, .result-row { display: grid; grid-template-columns: 11rem minmax(0, 1fr) 7.2rem; gap: 1rem; }
.result-labels { background: var(--navy); color: white; padding: .57rem .9rem; font-size: .8125rem; border-radius: var(--radius) var(--radius) 0 0; }
.result-row { align-items: start; padding: 1.03rem .9rem; }
.result-row + .result-row { border-top: 1px solid var(--soft-rule); }
.result-row:hover, .result-row:focus-within { background: #f7fbff; }
.record-number { color: #40566f; font-size: .86rem; font-weight: 590; }
.result-row .record-number { padding-top: .14rem; }
.result-main a { font-size: 1.05rem; font-weight: 750; }
.result-main p { color: #44566d; font-size: .9375rem; margin-top: .22rem; }
.result-status { display: flex; align-items: flex-start; flex-wrap: wrap; gap: .35rem .42rem; }
.result-status .badge { min-width: 3.4rem; text-align: center; }
.result-disclaimer { margin-top: 1rem; color: var(--muted); font-size: .8125rem; }
.state-panel {
  padding: clamp(1.25rem, 4vw, 2.4rem);
  background: var(--paper); border: 1px solid var(--rule); border-left: 4px solid #6f93b7; border-radius: var(--radius);
}
.state-panel p { margin-top: .48rem; color: var(--muted); }
.state-panel .result-actions { margin-top: 1rem; }
.state-error { border-left-color: var(--red); }
.loading-line { display: flex; align-items: center; gap: .64rem; }
.spinner { width: 1.15rem; height: 1.15rem; border: 2px solid #bbcede; border-top-color: var(--blue); border-radius: 50%; animation: turn 1s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }

.publication-layout { display: grid; grid-template-columns: minmax(0, 1fr) 13rem; gap: 1.25rem; align-items: start; }
.publication { border: 1px solid var(--rule); border-top: 4px solid var(--navy); border-radius: var(--radius); background: var(--paper); min-width: 0; }
.document-header, .document-body { padding-inline: clamp(1.05rem, 3.1vw, 2.3rem); }
.document-header { background: #f1f6fa; padding-block: 1.15rem 1.32rem; border-bottom: 1px solid var(--rule); }
.document-header h1 { font-size: clamp(1.5rem, 3vw, 2rem); margin-top: .6rem; }
.document-kicker { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .35rem .7rem; }
.document-kicker strong { color: var(--blue); font-size: .875rem; letter-spacing: .1em; }
.document-header .record-number { display: block; font-size: 1.09rem; margin-top: .45rem; }
.document-meta { display: flex; flex-wrap: wrap; gap: .5rem 1.15rem; margin-top: .8rem; font-size: .875rem; }
.document-meta div { display: flex; gap: .35rem; align-items: center; }
.document-meta dt { color: var(--muted); }
.document-body { padding-block: .2rem 1.5rem; }
.document-section { padding-block: 1.14rem; border-bottom: 1px solid var(--soft-rule); scroll-margin-top: 1rem; }
.document-section:last-child { border-bottom: 0; padding-bottom: 0; }
.document-section h2 { margin-bottom: .55rem; font-size: 1.05rem; }
.document-section p { white-space: pre-line; }
.document-section h3 { margin-bottom: .25rem; font-size: .875rem; color: var(--muted); }
.publication-figure {
  margin: .7rem 0 .15rem;
  border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper);
}

function normalize(value) {
  return value.normalize('NFKC').toLowerCase().trim();
}

function matchesFilter(entry, filter) {
  return filter === 'all' || (filter === 'rejected' ? entry.verdict === 'rejected' : entry.kind === filter);
}

function searchSamples(query, filter) {
  const terms = normalize(query).split(/\s+/).filter(Boolean);
  return CATALOG.filter((entry) => {
    if (!matchesFilter(entry, filter)) return false;
    const index = normalize([entry.title, entry.subject, entry.number, entry.abstract].join(' '));
    return terms.every((term) => index.includes(term));
  }).slice(0, 8);
}

function shuffled(entries) {
  const copy = [...entries];
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function randomSamples(filter) {
  const pool = shuffled(CATALOG.filter((entry) => matchesFilter(entry, filter)));
  if (filter === 'rejected') return pool.slice(0, 8);
  const rejected = pool.filter((entry) => entry.verdict === 'rejected');
  const accepted = pool.filter((entry) => entry.verdict === 'approved');
  const recognized = filter === 'all'
    ? [...accepted.filter((entry) => entry.kind === 'patent').slice(0, 4),
        ...accepted.filter((entry) => entry.kind === 'model').slice(0, 3)]
    : accepted.slice(0, 7);
  return shuffled([...recognized, ...rejected.slice(0, 8 - recognized.length)]);
}

function maybeIncludeSpecial(records, filter) {
  if (records.length < 8 || !matchesFilter(SELF, filter) || Math.random() >= 0.01) return records;
  const match = records.findLastIndex((entry) => entry.verdict === 'approved' && entry.kind === SELF.kind);
  return match < 0 ? records : records.map((entry, index) => index === match ? SELF : entry);
}

// Coordinates are in the drawing's viewBox. [name, feature x/y, numeral x/y].
function plate(caption, strokes, callouts, hidden = []) {
  return {
    caption,
    contour: strokes.join(' '),
    hidden: hidden.join(' '),
    parts: callouts.map(([name, x, y, labelX, labelY]) => ({ name, x, y, labelX, labelY }))
  };
}

const PATH_ARITY = { M: 2, L: 2, H: 1, V: 1, C: 6, Q: 4, Z: 0 };

function pathAxis(command, operand) {
  return command === 'V' || (command !== 'H' && operand % 2 === 1) ? 1 : 0;
}

function validPath(value, limit) {
  if (typeof value !== 'string' || !value.trim() || value.length > limit
    || /[^MLHVCQZ0-9\s,.]/.test(value)) return '';
  const tokens = value.match(/[MLHVCQZ]|\d+(?:\.\d+)?/g);
  if (!tokens || tokens[0] !== 'M') return '';
  let index = 0;
  let drawCount = 0;
  while (index < tokens.length) {
    const command = tokens[index];
    if (!Object.hasOwn(PATH_ARITY, command)) return '';
    index += 1;
    const start = index;
    const arity = PATH_ARITY[command];
    while (index < tokens.length && !Object.hasOwn(PATH_ARITY, tokens[index])) {
      if (!arity) return '';
      const dimension = pathAxis(command, index - start) ? FIGURE_HEIGHT : FIGURE_WIDTH;
      if (Number(tokens[index]) > dimension) return '';
      index += 1;
    }
    const length = index - start;
    if (arity && (length < arity || length % arity !== 0)) return '';
    if (command !== 'M' && command !== 'Z') drawCount += length / arity;
  }
  return drawCount >= 2 ? tokens.join(' ') : '';
}

// Compare line work in a common coordinate range regardless of position or scale.
function figureGeometryKey(contour) {
  const axes = [[], []];
  const commands = Array.from(contour.matchAll(/([MLHVCQZ])((?: [\d.]+)*)/g), ([, command, operands]) => ({
    command,
    values: operands ? operands.slice(1).split(' ').map(Number) : []
  }));
  for (const { command, values } of commands) {
    values.forEach((value, i) => axes[pathAxis(command, i)].push(value));
  }
  const min = axes.map((values) => Math.min(...values));
  const span = Math.max(1, ...axes.map((values, axis) => Math.max(...values) - min[axis]));
  return commands.map(({ command, values }) => command + values.map((value, i) =>
    Math.round((value - min[pathAxis(command, i)]) * 64 / span)).join(',')).join(' ');
}

// Simple orthogonal outlines need a component diagram.
function hasShapeDetail(contour, hidden) {
  if (hidden || /[CQ]/.test(contour)) return true;
  let x = 0;
  let y = 0;
  let startX = 0;
  let startY = 0;
  let segments = 0;
  for (const [, command, operands] of contour.matchAll(/([MLHVZ])((?: [\d.]+)*)/g)) {
    if (command === 'Z') {
      if (x !== startX && y !== startY) return true;
      segments += Number(x !== startX || y !== startY);
      x = startX;
      y = startY;
      continue;
    }
    const numbers = operands.slice(1).split(' ').map(Number);
    for (let i = 0; i < numbers.length; i += PATH_ARITY[command]) {
      const nextX = command === 'V' ? x : numbers[i];
      const nextY = command === 'H' ? y : numbers[i + Number(command !== 'V')];
      if (command === 'M' && i === 0) {
        startX = nextX;
        startY = nextY;
      } else {
        if (nextX !== x && nextY !== y) return true;
        segments += Number(nextX !== x || nextY !== y);
      }
      x = nextX;
      y = nextY;
    }
  }
  return segments > 12;
}

function placedSymbol(name, x, y) {
  const symbol = PART_SYMBOLS.find(([pattern]) => pattern.test(name))?.[1] ?? DEFAULT_PART_SYMBOL;
  const offset = [x - 46, y - 36];
  let axis = 0;
  return symbol.split(' ').map((token) => {
    if (/^[A-Z]$/.test(token)) {
      axis = 0;
      return token;
    }
    const value = Number(token) + offset[axis];
    axis = 1 - axis;
    return value;
  }).join(' ');
}

function componentDiagram(parts, { figureView, slot, id } = {}) {
  const view = figureView ?? ((slot ?? Number(id?.split('-').at(-1))) - 1);
  const positions = DRAWING_VIEWS[view]?.positions ?? DRAWING_VIEWS[0].positions;
  const used = positions.slice(0, parts.length);
  const coordinates = (axis) => used.map((point) => point[axis]);
  const middle = (values) => (Math.min(...values) + Math.max(...values)) / 2;
  const originX = FIGURE_WIDTH / 2 - middle(coordinates(0));
  const originY = FIGURE_HEIGHT / 2 - middle(coordinates(1));
  const callouts = used.map(([dx, dy], i) => {
    const x = originX + dx;
    const y = originY + dy;
    const labelX = x + (dx > 0 ? 65 : -65);
    const labelY = y + (dy > 0 ? 33 : -33);
    return [parts[i].name, x, y, labelX, labelY];
  });
  return plate('主要構成要素の模式図', callouts.map(([name, x, y]) => placedSymbol(name, x, y)), callouts);
}

function pointInDrawing(x, y, margin) {
  return Number.isFinite(x) && Number.isFinite(y)
    && x >= margin && x <= FIGURE_WIDTH - margin && y >= margin && y <= FIGURE_HEIGHT - margin;
}

function normalizeFigure(value, publication) {
  if (!Array.isArray(value?.parts)) return null;
  const names = new Set();
  const parts = [];
  for (const item of value.parts) {
    const name = typeof item?.name === 'string' ? item.name.trim() : '';
    if (!name || name.length > 36 || names.has(name)) continue;
    names.add(name);
    parts.push({ name, x: item.x, y: item.y, labelX: item.labelX, labelY: item.labelY });
    if (parts.length === 6) break;
  }
  if (parts.length < 2) return null;

  const contour = validPath(value.contour, 1900);
  const hidden = validPath(value.hidden, 650);
  const expectedCaption = typeof value.caption === 'string' ? value.caption.trim() : '';
  const caption = expectedCaption && expectedCaption.length <= 84 ? expectedCaption : '発明の主要部の構成図';
  const validCallouts = parts.every(({ x, y, labelX, labelY }) => pointInDrawing(x, y, 0)
    && pointInDrawing(labelX, labelY, 18) && Math.hypot(x - labelX, y - labelY) >= 18);
  if (contour && validCallouts && caption !== '発明を構成する要素のブロック図' && hasShapeDetail(contour, hidden)) {
    return { caption, contour, hidden, parts };
  }
  if (publication?.figureView === undefined && publication?.title === '黒点導毛方向指示装置'
    && parts.length === HAIR_DIRECTION_FIGURE.parts.length
    && HAIR_DIRECTION_FIGURE.parts.every(({ name }) => names.has(name))) {
    return HAIR_DIRECTION_FIGURE;
  }
  return componentDiagram(parts, publication);
}

function figureSvg(figure, id) {
  const leaders = figure.parts.map(({ x, y, labelX, labelY }, index) => {
    const length = Math.hypot(labelX - x, labelY - y);
    const offset = 13 / Math.max(13, length);
    const endX = (labelX + (x - labelX) * offset).toFixed(1);
    const endY = (labelY + (y - labelY) * offset).toFixed(1);
    return `<line class="plate-leader" x1="${html(x)}" y1="${html(y)}" x2="${endX}" y2="${endY}"/>
      <circle class="plate-target" cx="${html(x)}" cy="${html(y)}" r="2.15"/>
      <text class="plate-number" x="${html(labelX)}" y="${html(labelY)}">${10 + index}</text>`;
  }).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" class="patent-plate" role="img" aria-labelledby="${id}-caption"
      viewBox="0 0 ${FIGURE_WIDTH} ${FIGURE_HEIGHT}" width="${FIGURE_WIDTH}" height="${FIGURE_HEIGHT}">
    <title id="${id}-caption">図1 ${html(figure.caption)}</title>
    ${figure.hidden ? '<path class="plate-hidden" d="' + html(figure.hidden) + '"/>' : ''}
    <path class="plate-contour" d="${html(figure.contour)}"/>
    ${leaders}
  </svg>`;
}

function figureLegend(figure) {
  return `<dl class="plate-legend">${figure.parts.map(({ name }, index) =>
    '<div><dt>' + (10 + index) + '</dt><dd>' + html(name) + '</dd></div>').join('')}</dl>`;
}

function exhibitFigure(figure) {
  return `<figure class="publication-figure">
    <div class="plate-sheet">${figureSvg(figure, 'publication-plate')}</div>
    <figcaption>
      <div class="plate-caption-row">
        <span class="plate-caption"><strong>図1</strong> ${html(figure.caption)}</span>
        <button class="button button-secondary figure-button" type="button" data-action="expand-figure" aria-haspopup="dialog">
          ${icon('search')} 拡大表示
        </button>
      </div>
      ${figureLegend(figure)}
    </figcaption>
  </figure>`;
}

function closedObject(properties) {
  return { type: 'object', additionalProperties: false, required: Object.keys(properties), properties };
}

const FIGURE_SCHEMA = closedObject({
  caption: { type: 'string' },
  contour: { type: 'string' },
  hidden: { type: 'string' },
  parts: {
    type: 'array',
    minItems: 2,
    maxItems: 5,
    items: closedObject({
      name: { type: 'string' },
      x: { type: 'integer' },
      y: { type: 'integer' },
      labelX: { type: 'integer' },
      labelY: { type: 'integer' }
    })
  }
});

function publicationSchema(slots) {
  const numbers = slots.map((slot) => slot.slot);
  return closedObject({
    publications: {
      type: 'array',
      minItems: slots.length,
      maxItems: slots.length,
      items: closedObject({
        slot: { type: 'integer', enum: numbers },
        ...Object.fromEntries(TEXT_FIELDS.map((name) => [name, { type: 'string' }])),
        classCode: { type: 'string', enum: Object.keys(CLASSIFICATIONS) },
        claims: { type: 'array', minItems: 1, maxItems: 2, items: { type: 'string' } },
        citations: { type: 'array', maxItems: 2, items: { type: 'integer', enum: numbers } },
        figure: FIGURE_SCHEMA
      })
    }
  });
}

class APIProblem extends Error {
  constructor(code, message) {
    super(message);
    this.code = code;
  }
}

function responseProblem(status, code) {
  if (status === 401) return new APIProblem('key', 'APIキーを認証できませんでした。キーを確認してください。');
  if (status === 403 || status === 404) {
    return new APIProblem('access', 'このモデルまたはAPIを利用できません。キーの権限とモデルの設定を確認してください。');
  }
  if (status === 429 && code === 'insufficient_quota') {
    return new APIProblem('quota', 'OpenAI APIの利用枠が不足しています。請求設定と利用上限を確認してください。');
  }
  if (status === 429) return new APIProblem('rate', 'APIの利用制限に達しました。少し時間をおいて再試行してください。');
  if (status >= 500) return new APIProblem('upstream', 'OpenAI APIで一時的なエラーが発生しました。時間をおいて再試行してください。');
  return new APIProblem('request', 'OpenAI APIが要求を受け付けませんでした。モデルを変更するか、時間をおいて再試行してください。');
}

async function requestOpenAI(path, key, { body, signal, timeout }) {
  const controller = new AbortController();
  const cancel = () => controller.abort();
  if (signal?.aborted) cancel();
  signal?.addEventListener('abort', cancel, { once: true });
  const timer = setTimeout(cancel, timeout);
  try {
    const headers = { Authorization: 'Bearer ' + key };
    if (body) headers['Content-Type'] = 'application/json';
    const response = await fetch(API_ORIGIN + path, {
      method: body ? 'POST' : 'GET',
      body: body ? JSON.stringify(body) : undefined,
      headers,
      cache: 'no-store',
      credentials: 'omit',
      redirect: 'error',
      referrerPolicy: 'no-referrer',
      signal: controller.signal
    });
    const payload = await response.json().catch((error) => {
      if (controller.signal.aborted) throw error;
      return null;
    });
    if (!response.ok) throw responseProblem(response.status, payload?.error?.code);
    if (!payload) throw new APIProblem('format', 'APIの応答を読み取れませんでした。');
    return payload;
  } catch (error) {
    if (signal?.aborted) throw new APIProblem('cancelled', '処理を中止しました。');
    if (controller.signal.aborted) throw new APIProblem('timeout', 'OpenAI APIからの応答が時間内に届きませんでした。再試行できます。');
    if (error instanceof APIProblem) throw error;
    throw new APIProblem('network', 'OpenAI APIに接続できませんでした。通信環境やブラウザの接続制限を確認してください。');
  } finally {
    clearTimeout(timer);
    signal?.removeEventListener('abort', cancel);
  }
}

function formatProblem() {
  return new APIProblem('format', '公報を読み取れませんでした。再検索するか、API設定でモデルを変更してみてください。');
}

// Keep only fully closed JSON objects from an output cut off by the token limit.
function completePublicationRows(text) {
  const beginning = /^\s*\{\s*"publications"\s*:\s*\[/.exec(text);
  if (!beginning) return [];
  const rows = [];
  let depth = 0;
  let start = 0;
  let quoted = false;
  let escaped = false;
  for (let i = beginning[0].length; i < text.length; i += 1) {
    const char = text[i];
    if (quoted) {
      if (escaped) escaped = false;
      else if (char === '\\') escaped = true;
      else if (char === '"') quoted = false;
    } else if (char === '"') {
      quoted = true;
    } else if (char === '{') {
      if (depth === 0) start = i;
      depth += 1;
    } else if (char === '}' && depth > 0) {
      depth -= 1;
      if (depth === 0) {
        try { rows.push(JSON.parse(text.slice(start, i + 1))); } catch { /* Ignore this record. */ }
      }
    } else if (char === ']' && depth === 0) {
      break;
    }
  }
  return rows;
}

function readPublicationRows(payload) {
  const messages = (Array.isArray(payload.output) ? payload.output : [])
    .filter((item) => item?.type === 'message' && item.phase !== 'commentary' && Array.isArray(item.content));
  const parts = messages.flatMap((item) => item.content);
  const reason = payload.incomplete_details?.reason;
  if (parts.some((part) => part?.type === 'refusal') || reason === 'content_filter') {
    throw new APIProblem('refusal', 'この検索条件では公報を生成できませんでした。別の検索語でお試しください。');
  }
  if (payload.status === 'failed') {
    throw new APIProblem('upstream', 'OpenAI側で公報の生成を完了できませんでした。時間をおいて再試行してください。');
  }
  const truncated = payload.status === 'incomplete' && reason === 'max_output_tokens';
  if (payload.status !== 'completed' && !truncated) throw formatProblem();
  const text = messages.at(-1)?.content.filter((part) => part?.type === 'output_text').map((part) => part.text).join('') ?? '';
  try {
    const rows = JSON.parse(text)?.publications;
    if (Array.isArray(rows)) return rows;
  } catch { /* A token limit can interrupt JSON inside an individual record. */ }
  if (truncated) return completePublicationRows(text);
  throw formatProblem();
}

function titleKey(title) {
  return normalize(title).replace(/[\p{P}\p{Z}\s]/gu, '');
}

function cleanPublication(entry, slot) {
  if (!Object.hasOwn(CLASSIFICATIONS, entry.classCode)) return null;
  const fields = {};
  for (const name of TEXT_FIELDS) {
    const value = typeof entry[name] === 'string' ? entry[name].trim() : '';
    if (!value) return null;
    fields[name] = value;
  }
  const claims = Array.isArray(entry.claims)
    ? entry.claims.filter((claim) => typeof claim === 'string' && claim.trim()).map((claim) => claim.trim()).slice(0, 2)
    : [];
  if (!claims.length) return null;

  const citations = Array.isArray(entry.citations) ? entry.citations : [];
  return {
    ...fields,
    ...slot,
    classCode: entry.classCode,
    claims,
    citations: [...new Set(citations.filter((ref) => Number.isInteger(ref)
      && ref >= 1 && ref <= RECORD_COUNT && ref !== slot.slot))].slice(0, 2),
    figure: normalizeFigure(entry.figure, slot)
  };
}

function publicationSlots(filter) {
  const views = shuffled(DRAWING_VIEWS.map((_, index) => index));
  return Array.from({ length: RECORD_COUNT }, (_, i) => {
    const mixed = filter === 'all' || filter === 'rejected';
    const kind = mixed ? (i < GROUP_SIZE ? 'patent' : 'model') : filter;
    const rejected = filter === 'rejected' || i === GROUP_SIZE - 1 || (filter === 'all' && i === RECORD_COUNT - 1);
    return { slot: i + 1, kind, verdict: rejected ? 'rejected' : 'approved', figureView: views[i] };
  });
}

function checkModelAccess(model, key, signal, timeout = 15000) {
  return requestOpenAI('/models/' + encodeURIComponent(model), key, { signal, timeout });
}

async function generatePublications({ subject, random, filter, recentTitles, model, key, signal, onProgress }) {
  const plan = publicationSlots(filter);
  const received = new Map();
  const usedTitles = new Set(recentTitles.map(titleKey));
  const failures = [];

  async function compile(slots, focus, refilling = false) {
    const body = {
      model,
      store: false,
      reasoning: { effort: 'none' },
      max_output_tokens: 1000 + slots.length * 1350,
      instructions: EXAMINER_INSTRUCTIONS,
      input: JSON.stringify({
        subject, mode: random ? '分野抽出' : 'キーワード検索',
        slots: slots.map(({ figureView, ...slot }) => ({ ...slot, drawingView: DRAWING_VIEWS[figureView].brief })),
        focus,
        avoidTitles: [...recentTitles, ...[...received.values()].map((entry) => entry.title)],
        variation: crypto.getRandomValues(new Uint32Array(1))[0].toString(36)
      }),
      text: {
        format: {
          type: 'json_schema', name: 'jflatbad_publications', strict: true,
          schema: publicationSchema(slots)
        }
      }
    };
    try {
      const payload = await requestOpenAI('/responses', key, { body, signal, timeout: REQUEST_TIMEOUT });
      const rows = readPublicationRows(payload);
      for (const row of rows) {
        const slot = slots.find((item) => item.slot === row?.slot);
        if (!slot || received.has(slot.slot)) continue;
        const entry = cleanPublication(row, slot);
        if (!entry) continue;
        const title = titleKey(entry.title);
        if (!title || usedTitles.has(title)) continue;
        usedTitles.add(title);
        received.set(slot.slot, entry);
      }
      onProgress?.({ count: received.size, refilling });
    } catch (error) {
      failures.push(error);
    }
  }

  await Promise.all([
    compile(plan.slice(0, GROUP_SIZE), '対象物の機構、操作、収納など、実物の使い道に着目する。'),
    compile(plan.slice(GROUP_SIZE), '対象物が使われる場面、手順、点検、記録の順序に着目する。')
  ]);

  if (signal.aborted) throw new APIProblem('cancelled', '処理を中止しました。');
  const missing = plan.filter(({ slot }) => !received.has(slot));
  if (missing.length && failures.every((error) => error.code === 'format')) {
    onProgress?.({ count: received.size, refilling: true });
    await compile(missing.slice(0, GROUP_SIZE), '不足している番号だけ記述する。本文と図面は要点を短くまとめる。', true);
  }
  if (signal.aborted) throw new APIProblem('cancelled', '処理を中止しました。');

  const problem = failures.find((error) => error.code !== 'format');
  if (!received.size) {
    if (problem?.code === 'network') {
      // A model lookup distinguishes an invalid key from a network failure when
      // the response to the generation request is unreadable across origins.
      try { await checkModelAccess(model, key, signal, 5000); }
      catch (diagnostic) { if (diagnostic.code === 'key') throw diagnostic; }
    }
    throw problem ?? formatProblem();
  }
  const entries = plan.map(({ slot }) => received.get(slot)).filter(Boolean);
  const geometries = new Set();
  for (const entry of entries) {
    if (!entry.figure) continue;
    const geometry = figureGeometryKey(entry.figure.contour);
    if (geometries.has(geometry)) entry.figure = componentDiagram(entry.figure.parts, entry);
    geometries.add(geometry);
  }
  return { entries, warning: problem?.message ?? '' };
}

function readRoute() {
  const path = portable
    ? (location.hash.startsWith('#/') ? location.hash.slice(1) : '/')
    : location.pathname + location.search;
  return new URL('https://jflatbad.invalid' + path);
}

function routeString(route) {
  return route.pathname + route.search;
}

function queryValue(value) {
  return (value ?? '').trim().slice(0, QUERY_LIMIT);
}

function filterValue(value) {
  return Object.hasOwn(FILTERS, value) ? value : 'all';
}

function searchPath({ query = '', filter = 'all', random = false, source = 'sample' }, batchId) {
  const params = new URLSearchParams({ filter, source });
  if (query) params.set('q', query);
  if (random) params.set('mode', 'random');
  if (batchId) params.set('batch', batchId);
  return '/search?' + params.toString();
}

function editSearchPath({ query, filter }) {
  const params = new URLSearchParams();
  if (query) params.set('q', query);
  if (filter !== 'all') params.set('filter', filter);
  const encoded = params.toString();
  return encoded ? '/?' + encoded : '/';
}

function publicationPath(id, batchId) {
  return '/publication/' + encodeURIComponent(id) + (batchId ? '?batch=' + encodeURIComponent(batchId) : '');
}

function restoreSession() {
  try {
    const saved = JSON.parse(sessionStorage.getItem(CACHE_KEY) ?? 'null');
    if (Array.isArray(saved?.batches) && Number.isSafeInteger(saved.serial)
      && saved.serial >= 200000 && saved.serial <= 999999) return saved;
  } catch {
    // Private browsing and file URLs can prevent storage.
  }
  return { batches: [], serial: 200000 };
}

function keepBatch(batch) {
  session.batches = [...session.batches.slice(-(MAX_BATCHES - 1)), batch];
  try {
    sessionStorage.setItem(CACHE_KEY, JSON.stringify(session));
  } catch {
    // The active page still keeps the records in memory.
  }
}

function freshId() {
  return [...crypto.getRandomValues(new Uint32Array(3))].map((part) => part.toString(36)).join('-');
}

function batchFor(id) {
  return session.batches.find((batch) => batch.id === id);
}

function recordFor(id, batch) {
  return batch?.records.find((entry) => entry.id === id) ?? SAMPLE_BY_ID.get(id);
}

function dated(date) {
  return `<time class="date" datetime="${html(date)}">${html(date.replaceAll('-', '.'))}</time>`;
}

function badge(label, cls) {
  return `<span class="badge ${cls ? 'badge-' + html(cls) : ''}">${html(label)}</span>`;
}

function verdictBadge(entry) {
  return badge(entry.verdict === 'approved' ? '認定' : '不認定', entry.verdict);
}

function crumbs(current, previous = []) {
  return `<nav class="crumbs" aria-label="現在位置"><ol><li>${link('/', 'トップ')}</li>
    ${previous.map(([path, text]) => '<li>' + link(path, html(text)) + '</li>').join('')}
    <li aria-current="page">${html(current)}</li></ol></nav>`;
}

function updateShell(route) {
  const path = route.pathname;
  let active = '/';
  if (path.startsWith('/info/notice')) active = infoPath('notices');
  else if (path === infoPath('standards')) active = path;
  else if (path.startsWith('/info/')) active = infoPath('related');
  for (const item of header.querySelectorAll('.nav-item')) {
    if (item.dataset.route === active) item.setAttribute('aria-current', 'page');
    else item.removeAttribute('aria-current');
  }
  updateKeyState();
}

function updateKeyState() {
  header.querySelector('.api-button').dataset.configured = String(Boolean(apiKey));
  document.querySelector('#key-state').textContent = apiKey
    ? '設定済み。別のキーに切り替える場合は入力してください。'
    : '未設定';
  const source = main.querySelector('.search-source');
  if (source) {
    source.querySelector('.key-guide-message').textContent = apiKey
      ? 'AIで新しい公報を生成します。'
      : 'AIで新しい公報を生成するには、OpenAI APIキーを入力してください。';
    source.querySelector('.key-guide-note').hidden = Boolean(apiKey);
    source.querySelector('button').hidden = Boolean(apiKey);
  }
}

function resultView(route) {
  const params = route.searchParams;
  const batchId = params.get('batch');
  const batch = batchFor(batchId);
  const task = job?.id === batchId ? job : null;
  const spec = batch?.spec ?? task?.spec ?? {
    query: queryValue(params.get('q')),
    filter: filterValue(params.get('filter')),
    random: params.get('mode') === 'random',
    source: params.get('source') === 'ai' ? 'ai' : 'sample'
  };
  currentResult = spec;
  const records = batch?.records ?? (
    !task && spec.source === 'sample' && !spec.random && spec.query
      ? searchSamples(spec.query, spec.filter)
      : null
  );
  const busy = task?.stage === 'pending';
  const mode = spec.random ? (spec.subject ? 'ランダム検索 / ' + spec.subject : 'ランダム検索') : 'キーワード検索';
  const count = records ? `<div class="result-count"><dt>該当件数</dt><dd><b>${records.length}</b> 件</dd></div>` : '';
  return { title: '検索結果', content: `
    ${crumbs('検索結果')}
    <div class="result-head">
      <div class="page-title"><h1>検索結果</h1></div>
      <div class="result-actions">
        ${link(editSearchPath(spec), '検索条件を変更', 'button button-secondary')}
        <button class="button button-secondary" type="button" data-action="random"${busy ? ' disabled' : ''}>
          ${icon('random')} ランダム検索
        </button>
        ${spec.source === 'sample' && records?.length && apiKey
          ? '<button class="button button-primary" type="button" data-action="retry">AIでこの条件を検索</button>' : ''}
      </div>
    </div>
    <dl class="result-conditions">
      <div><dt>方法</dt><dd>${html(mode)}</dd></div>
      ${spec.query ? `<div><dt>検索語</dt><dd>${html(spec.query)}</dd></div>` : ''}
      <div><dt>対象</dt><dd>${html(FILTERS[spec.filter])}</dd></div>
      <div><dt>出典</dt><dd>${spec.source === 'ai' ? 'AI生成公報' : '見本公報'}</dd></div>
      ${count}
    </dl>
    ${spec.source === 'sample' && records?.length && !apiKey ? `<div class="key-guide result-key-guide">
      <p class="key-guide-message">見本公報を表示しています。AIで新しい公報を生成するには、OpenAI APIキーを入力してください。</p>
      ${apiKeyButton()}
    </div>` : ''}
    ${batch?.spec.source === 'ai' && records.length < RECORD_COUNT ? `<div class="key-guide result-key-guide" role="status">
      <div>
        <p class="key-guide-message">${records.length}件の公報を取得できました。取得済みの公報を表示しています。</p>
        ${batch.warning ? '<p class="key-guide-note">' + html(batch.warning) + '</p>' : ''}
      </div>
      ${apiKey ? '<button class="button button-secondary" type="button" data-action="retry">同じ条件で再検索</button>' : ''}
    </div>` : ''}
    ${resultBody(spec, records, task, batch?.id)}
    <p class="result-disclaimer">検索結果の有用性について一切保証しません。</p>` };
}

function resultBody(spec, records, task, batchId) {
  if (task?.stage === 'pending') {
    return `<section class="state-panel">
      <h2 class="loading-line"><span class="spinner" aria-hidden="true"></span>公報を編纂しています</h2>
      <p id="generation-status" role="status">${generationStatus(task)}</p>
      <div class="result-actions"><button class="button button-secondary" type="button" data-action="cancel">中止</button></div>
    </section>`;
  }
  if (task?.stage === 'error' || task?.stage === 'cancelled') {
    const settingsAction = ['key', 'access', 'quota'].includes(task.errorCode) || !apiKey;
    return `<section class="state-panel ${task.stage === 'error' ? 'state-error' : ''}">
      <h2>${task.stage === 'error' ? '公報を取得できませんでした' : '公報の編纂を中止しました'}</h2>
      <p role="status">${html(task.message)}</p>
      <div class="result-actions">
        ${settingsAction ? '<button class="button button-primary" type="button" data-action="settings">API設定を開く</button>' : ''}
        ${apiKey ? '<button class="button button-secondary" type="button" data-action="retry">再試行</button>' : ''}
        <button class="button button-secondary" type="button" data-action="sample">見本公報で検索</button>
      </div>
    </section>`;
  }
  if (!records) {
    return `<section class="state-panel"><h2>検索結果を照会できません</h2>
      <p>保存期間を過ぎたか、別のタブで生成された検索結果です。</p>
      ${link(editSearchPath(spec), '検索画面へ', 'button button-text')}
    </section>`;
  }
  if (records.length === 0) {
    return `<section class="state-panel"><h2>該当する見本公報がありません</h2>
      <p>検索条件が有用すぎる可能性があります。</p>
      <p>${apiKey ? '同じ検索語で新しい公報を生成できます。' : 'この検索語で新しい公報を生成するには、OpenAI APIキーを入力してください。'}</p>
      <div class="result-actions">
        ${apiKey ? '<button class="button button-primary" type="button" data-action="retry">AIでこの条件を検索</button>' : apiKeyButton('button-primary')}
        <button class="button button-secondary" type="button" data-action="random">無用化して再検索</button>
        ${infoLink('archive', '見本公報の収録分野')}
      </div>
    </section>`;
  }
  const items = records.map((entry) => `<li class="result-row">
    <div class="record-number">${html(entry.number)}</div>
    <div class="result-main">
      ${link(publicationPath(entry.id, batchId), html(entry.title))}
      <p>${html(entry.abstract)}</p>
    </div>
    <div class="result-status">${badge(KINDS[entry.kind], entry.kind)}${verdictBadge(entry)}</div>
  </li>`).join('');
  return `<div class="result-labels" aria-hidden="true"><span>公報番号</span><span>発明の名称・要約</span><span>区分・審査結果</span></div>
    <ol class="result-list" aria-label="公報一覧">${items}</ol>`;
}

const DOCUMENT_SECTIONS = [
  ['field', '技術分野'],
  ['background', '背景技術'],
  ['problem', '課題'],
  ['solution', '解決手段'],
  ['effect', '発明の効果']
];

function recordLinks(entries, batchId) {
  return `<ul class="record-links">${entries.map((entry) => `<li>
    <span class="record-number">${html(entry.number)}</span>
    ${link(publicationPath(entry.id, batchId), html(entry.title))}
  </li>`).join('')}</ul>`;
}

function documentSection(id, title, content) {
  return `<section class="document-section" id="${id}"><h2 tabindex="-1">${title}</h2>${content}</section>`;
}

function publicationView(route, id) {
  const batch = batchFor(route.searchParams.get('batch'));
  const entry = recordFor(id, batch);
  if (!entry) return missingView('公報を照会できません', 'AI生成公報は、生成したタブの閲覧中に限り参照できます。');
  const figure = SAMPLE_FIGURES[entry.id] ?? normalizeFigure(entry.figure, entry);
  activeFigure = figure;
  const figureSection = figure ? exhibitFigure(figure)
    : entry.source === 'ai' && entry.figure === null ? '<p>図面を読み取れませんでした。本文は以下から確認できます。</p>' : '';
  const remembered = history.state?.returnTo;
  const returnTo = remembered?.path?.startsWith('/search?') || remembered?.path?.startsWith('/info/')
    ? remembered
    : batch ? { path: searchPath(batch.spec, batch.id), label: '検索結果' }
      : { path: infoPath('archive'), label: '開放無用情報データベース' };
  const backText = returnTo.label === '検索結果' ? '検索結果一覧へ戻る' : returnTo.label + 'へ戻る';
  const backLink = (style) => link(returnTo.path, html(backText), style, ' data-restore-list');
  const citations = entry.citations.map((ref) => recordFor(ref, batch)).filter(Boolean);
  const articleSections = DOCUMENT_SECTIONS.map(([key, label]) => documentSection(key, label, '<p>' + html(entry[key]) + '</p>')).join('');
  const claims = entry.claims.map((text, index) => `<div class="claim"><h3>請求項${index + 1}</h3><p>${html(text)}</p></div>`).join('');
  const outline = [
    ['abstract', '要約'], ...(figureSection ? [['drawings', '図面']] : []), ...DOCUMENT_SECTIONS,
    ['claims', '特許請求の範囲'], ['review', '無用性審査結果'], ['citations', '引用公報']
  ];
  const claimHeading = entry.kind === 'model' ? '不実用新案登録請求の範囲' : '特許請求の範囲';
  return { title: entry.title, content: `
    ${crumbs('公報詳細', [[returnTo.path, returnTo.label]])}
    <div class="publication-layout">
      <article class="publication">
        <header class="document-header">
          <div class="document-kicker"><strong>無用発明庁公報</strong>${badge(entry.source === 'ai' ? 'AI生成公報' : '見本公報')}</div>
          <span class="record-number">${html(entry.number)}</span>
          <h1>${html(entry.title)}</h1>
          <dl class="document-meta">
            <div><dt>区分</dt><dd>${badge(KINDS[entry.kind], entry.kind)}</dd></div>
            <div><dt>審査</dt><dd>${verdictBadge(entry)}</dd></div>
            <div><dt>公表日</dt><dd>${dated(entry.date)}</dd></div>
            <div><dt>分類</dt><dd>${infoLink('classification', entry.classCode + ' ' + CLASSIFICATIONS[entry.classCode])}</dd></div>
          </dl>
        </header>
        <div class="document-body">
          ${documentSection('abstract', '要約', '<p>' + html(entry.abstract) + '</p>')}
          ${figureSection ? documentSection('drawings', '図面', figureSection) : ''}
          ${articleSections}
          ${documentSection('claims', claimHeading, claims)}
          ${documentSection('review', '無用性審査結果', `<div class="review-block ${html(entry.verdict)}">${verdictBadge(entry)}<p>${html(entry.review)}</p></div>`)}
          ${documentSection('citations', '引用公報', citations.length ? recordLinks(citations, batch?.id) : '<p>該当する引用公報はありません。</p>')}
        </div>
      </article>
      <aside class="document-side">
        ${backLink('button button-secondary')}
        <nav class="toc" aria-label="公報の目次"><strong>公報の目次</strong><ul>
          ${outline.map(([key, label]) => `<li><button type="button" data-action="jump" data-section="${key}">${key === 'claims' ? '請求項' : label}</button></li>`).join('')}
        </ul></nav>
      </aside>
    </div>
    <div class="document-back">${backLink('button button-secondary')}</div>` };
}

function infoSection(section) {
  const paragraphs = section.paragraphs?.map((line) => '<p>' + html(line) + '</p>').join('') ?? '';
  const table = section.rows ? `<table class="info-table">
    <thead><tr>${section.headings.map((label) => '<th scope="col">' + html(label) + '</th>').join('')}</tr></thead>
    <tbody>${section.rows.map(([key, ...cells]) => '<tr><th scope="row">' + html(key) + '</th>'
      + cells.map((cell) => '<td>' + html(cell) + '</td>').join('') + '</tr>').join('')}</tbody></table>` : '';
  return `<section class="info-section"><h2>${html(section.heading)}</h2>${paragraphs}${table}</section>`;
}

function infoView(slug) {
  if (slug === 'notices' || slug === 'related') {
    const title = INFO_TITLES.get(slug);
    return { title, content: `
      ${crumbs(title)}
      <div class="page-title"><h1>${title}</h1></div>
      ${slug === 'notices' ? '<ul class="notice-list notice-page-list">' + noticeList() + '</ul>' : banners()}` };
  }

  const notice = NOTICES.find((item) => item.slug === slug);
  const page = notice ?? (Object.hasOwn(INFO_PAGES, slug) ? INFO_PAGES[slug] : null);
  if (!page) return missingView();
  const references = page.references?.map((id) => SAMPLE_BY_ID.get(id)).filter(Boolean) ?? [];
  const searchLinks = page.searches?.map(({ query, text }) => '<li>' + link(searchPath({ query }), html(text)) + '</li>').join('');
  const article = [
    page.sections?.map(infoSection).join(''),
    searchLinks ? '<section class="info-section"><h2>指定の検索で照会</h2><ul class="inline-links">' + searchLinks + '</ul></section>' : '',
    references.length ? '<section class="info-section"><h2>参照公報</h2>' + recordLinks(references) + '</section>' : ''
  ].filter(Boolean).join('');
  const questions = page.questions ? `<div class="faq-list">${page.questions.map(([q, a]) =>
    '<details><summary>' + html(q) + '</summary><p>' + html(a) + '</p></details>').join('')}</div>` : '';
  const related = page.related?.map((item) => '<li>' + infoLink(item) + '</li>').join('') ?? '';
  const parent = notice ? 'notices' : 'related';
  return { title: page.title, content: `
    <div class="info-page">
      ${crumbs(page.title, [[infoPath(parent), INFO_TITLES.get(parent)]])}
      <div class="page-title">
        ${notice ? '<div class="notice-title-meta">' + dated(notice.date) + badge(notice.category, notice.tone) + '</div>' : ''}
        <h1>${html(page.title)}</h1>
        <p>${html(page.intro)}</p>
      </div>
      ${article ? '<article class="info-article">' + article + '</article>' : ''}
      ${questions}
      ${related ? '<nav class="info-related" aria-label="関連資料"><h2>関連資料</h2><ul class="inline-links">' + related + '</ul></nav>' : ''}
    </div>` };
}

function missingView(title = 'ページを照会できません', message = '指定された資料は収録されていません。') {
  return { title, content: `${crumbs(title)}
    <div class="state-panel"><h1>${html(title)}</h1><p>${html(message)}</p>
    ${link('/', '公報検索へ', 'button button-text')}</div>` };
}

function render() {
  if (figureDialog.open) figureDialog.close();
  const route = readRoute();
  currentPath = routeString(route);
  currentResult = null;
  activeFigure = null;
  const path = route.pathname.replace(/\/+$/, '') || '/';
  if (job?.stage === 'pending' && (path !== '/search' || route.searchParams.get('batch') !== job.id)) {
    cancelJob();
  }

  let view;
  if (path === '/' || path === '/index.html') view = homeView(route);
  else if (path === '/search') view = resultView(route);
  else if (/^\/publication\/[a-z0-9-]+$/.test(path)) view = publicationView(route, path.split('/')[2]);
  else if (/^\/info\/[a-z0-9-]+$/.test(path)) view = infoView(path.split('/')[2]);
  else view = missingView();

  main.innerHTML = view.content;
  document.title = view.title + ' | JFLATBAD';
  updateShell(route);
}

function focusView(scrollY = 0) {
  main.focus({ preventScroll: true });
  window.scrollTo(0, scrollY);
}

function navigate(path, { replace = false, returnTo, scrollY = 0 } = {}) {
  // The stored position belongs to the history entry that is being left.
  if (!replace) history.replaceState({ ...history.state, scrollY: window.scrollY }, '');
  const state = { returnTo, scrollY };
  if (replace) history.replaceState(state, '', href(path));
  else history.pushState(state, '', href(path));
  render();
  focusView(scrollY);
}

function keywordProblem(value) {
  if (!value.trim()) return 'キーワードを入力してください。ランダム検索では入力は不要です。';
  if (value.trim().length > QUERY_LIMIT) return QUERY_LIMIT + '文字以内で入力してください。';
  if (/\bsk-[a-z0-9_-]{8,}/i.test(value) || (apiKey && value.includes(apiKey))) {
    return 'APIキーは検索欄ではなく、API設定に入力してください。';
  }
  return '';
}

function showInputError(message) {
  const field = main.querySelector('#query');
  if (!field) return;
  const target = main.querySelector('#query-error');
  target.textContent = message;
  target.hidden = !message;
  if (message) {
    field.setAttribute('aria-invalid', 'true');
    field.focus();
  } else {
    field.removeAttribute('aria-invalid');
  }
}

function currentFilter() {
  const selected = main.querySelector('input[name="filter"]:checked')?.value;
  return filterValue(selected ?? currentResult?.filter);
}

function pickLens() {
  const recent = new Set(session.batches.filter(({ spec }) => spec.random && spec.subject)
    .slice(-5).map(({ spec }) => spec.subject));
  return shuffled(LENSES.filter((lens) => !recent.has(lens)))[0];
}

function priorTitles(spec) {
  const past = session.batches
    .filter((batch) => batch.spec.source === 'ai'
      && (spec.random ? batch.spec.random : normalize(batch.spec.query) === normalize(spec.query)))
    .slice(-3).flatMap((batch) => batch.records.map((entry) => entry.title));
  const samples = spec.random ? [] : searchSamples(spec.query, 'all').map((entry) => entry.title);
  return [...new Set([...past, ...samples, SELF.title])].slice(-30);
}

function generationStatus(task) {
  if (task.refilling) {
    return task.received ? task.received + '件を取得しました。不足分だけ追加で取得しています。'
      : '件数を減らし、短い公報にして取得し直しています。';
  }
  if (task.received) return task.received + '件を取得しました。残りの公報を編纂しています。';
  return '公報を4件ずつ編纂しています。応答には時間がかかる場合があります。';
}

function numberGenerated(entries, batchId) {
  const date = new Intl.DateTimeFormat('sv-SE', {
    timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit'
  }).format(new Date());
  const ids = new Map(entries.map((entry) => [entry.slot, 'gen-' + batchId + '-' + entry.slot]));
  return entries.map((entry) => {
    session.serial = session.serial >= 999999 ? 200001 : session.serial + 1;
    const related = CATALOG.find((record) => record.classCode === entry.classCode);
    const id = ids.get(entry.slot);
    const references = entry.citations.map((citation) => ids.get(citation)).filter((ref) => ref && ref !== id);
    return {
      ...entry, id, date, source: 'ai',
      number: publicationNumber(entry.kind, date.slice(0, 4), session.serial),
      citations: references.length ? references : [related.id]
    };
  });
}

async function runJob(task, key, model) {
  try {
    const result = await generatePublications({
      subject: task.spec.subject,
      random: task.spec.random,
      filter: task.spec.filter,
      recentTitles: priorTitles(task.spec),
      model,
      key,
      signal: task.controller.signal,
      onProgress: ({ count, refilling }) => {
        task.received = count;
        task.refilling = refilling;
        const status = main.querySelector('#generation-status');
        if (currentPath === task.path && status) status.textContent = generationStatus(task);
      }
    });
    if (task.controller.signal.aborted) return;
    const generated = numberGenerated(result.entries, task.id);
    const records = maybeIncludeSpecial(generated, task.spec.filter);
    // If the rare fixed record replaced a generated result, retarget references to it.
    const replaced = generated.find((entry) => !records.includes(entry));
    const included = replaced ? records.map((entry) => entry === SELF ? entry : {
      ...entry, citations: entry.citations.map((ref) => ref === replaced.id ? SELF_ID : ref)
    }) : records;
    keepBatch({ id: task.id, spec: task.spec, records: included, warning: result.warning });
    task.stage = 'done';
  } catch (error) {
    if (task.controller.signal.aborted) return;
    task.stage = 'error';
    task.errorCode = error instanceof APIProblem ? error.code : 'format';
    task.message = error instanceof APIProblem ? error.message : '公報を処理できませんでした。再試行できます。';
  }
  if (currentPath === task.path) {
    const wasInside = main.contains(document.activeElement);
    render();
    if (wasInside) main.focus({ preventScroll: true });
  }
}

function startSearch({ query = '', random = false, filter = 'all', forceSample = false, replace = false } = {}) {
  if (job?.stage === 'pending') return;
  const q = random ? '' : queryValue(query);
  if (!random && keywordProblem(q)) {
    if (main.querySelector('#query')) showInputError(keywordProblem(q));
    else navigate(editSearchPath({ query: '', filter }));
    return;
  }
  const live = Boolean(apiKey) && !forceSample;
  const spec = {
    query: q, filter, random, source: live ? 'ai' : 'sample',
    subject: random ? (live ? pickLens() : '') : q
  };
  const id = freshId();
  const path = searchPath(spec, id);
  if (!live) {
    const found = random ? randomSamples(filter) : searchSamples(q, filter);
    keepBatch({ id, spec, records: maybeIncludeSpecial(found, filter) });
    navigate(path, { replace });
    return;
  }
  const task = { id, spec, path, controller: new AbortController(), stage: 'pending', received: 0, refilling: false };
  job = task;
  navigate(path, { replace });
  void runJob(task, apiKey, selectedModel);
}

function cancelJob() {
  if (job?.stage !== 'pending') return;
  job.stage = 'cancelled';
  job.message = '必要に応じて、同じ条件で対象を照会し直すことができます。';
  job.controller.abort();
}

function settingsFeedback(message = '', error = false) {
  settingsMessage.textContent = message;
  settingsMessage.dataset.error = String(error);
  settingsMessage.hidden = message.length === 0;
}

function endKeyCheck() {
  if (keyCheck) keyCheck.abort();
  keyCheck = null;
  settingsForm.querySelector('[data-action="check-key"]').disabled = false;
}

function openSettings(button) {
  if (dialog.open) return;
  keyTrigger = button;
  endKeyCheck();
  keyField.value = '';
  modelField.value = selectedModel;
  settingsFeedback();
  updateKeyState();
  dialog.showModal();
  keyField.focus();
}

function expandFigure(button) {
  if (!activeFigure || figureDialog.open) return;
  figureTrigger = button;
  const stage = document.querySelector('#large-figure');
  document.querySelector('#figure-preview-caption').textContent = '図1　' + activeFigure.caption;
  stage.innerHTML = figureSvg(activeFigure, 'large-plate') + figureLegend(activeFigure);
  figureDialog.showModal();
  stage.scrollLeft = Math.max(0, (stage.scrollWidth - stage.clientWidth) / 2);
  stage.scrollTop = 0;
}

figureDialog.addEventListener('close', () => {
  document.querySelector('#large-figure').replaceChildren();
  if (figureTrigger?.isConnected) figureTrigger.focus({ preventScroll: true });
  figureTrigger = null;
});

function keyCandidate() {
  const draft = keyField.value.trim();
  if (draft && !/^sk-[a-z0-9_-]{4,509}$/i.test(draft)) {
    settingsFeedback('OpenAI APIキーの形式を確認してください。', true);
    keyField.focus();
    return null;
  }
  return draft || apiKey;
}

async function checkKey() {
  const candidate = keyCandidate();
  if (candidate === null) return;
  if (!candidate) {
    settingsFeedback('接続を確認するにはAPIキーを入力してください。', true);
    keyField.focus();
    return;
  }
  endKeyCheck();
  const check = new AbortController();
  keyCheck = check;
  const checkButton = settingsForm.querySelector('[data-action="check-key"]');
  checkButton.disabled = true;
  settingsFeedback('OpenAI APIへの接続を確認しています。');
  try {
    const model = Object.hasOwn(MODELS, modelField.value) ? modelField.value : DEFAULT_MODEL;
    const data = await checkModelAccess(model, candidate, check.signal);
    if (check.signal.aborted) return;
    if (!data.id) throw new APIProblem('format', '接続確認の応答を読み取れませんでした。');
    settingsFeedback('選択したモデルへの接続を確認しました。');
  } catch (error) {
    if (!check.signal.aborted) settingsFeedback(error.message, true);
  } finally {
    if (keyCheck === check) endKeyCheck();
  }
}

settingsForm.addEventListener('submit', (event) => {
  event.preventDefault();
  const candidate = keyCandidate();
  if (candidate === null) return;
  const changed = apiKey !== candidate;
  const pending = changed && job?.stage === 'pending';
  if (pending) cancelJob();
  apiKey = candidate;
  selectedModel = Object.hasOwn(MODELS, modelField.value) ? modelField.value : DEFAULT_MODEL;
  keyField.value = '';
  dialog.close();
  if (pending || currentResult) render();
  else updateKeyState();
});

dialog.addEventListener('close', () => {
  endKeyCheck();
  keyField.value = '';
  settingsFeedback();
  if (keyTrigger?.isConnected) keyTrigger.focus({ preventScroll: true });
  else header.querySelector('.api-button').focus({ preventScroll: true });
  keyTrigger = null;
});

for (const field of [keyField, modelField]) {
  field.addEventListener('input', () => {
    endKeyCheck();
    settingsFeedback();
  });
}

main.addEventListener('input', (event) => {
  if (event.target.id === 'query' && event.target.hasAttribute('aria-invalid')) showInputError('');
});

main.addEventListener('submit', (event) => {
  if (event.target.id !== 'search-form') return;
  event.preventDefault();
  const query = main.querySelector('#query').value;
  const problem = keywordProblem(query);
  if (problem) showInputError(problem);
  else startSearch({ query, filter: currentFilter() });
});

document.addEventListener('click', (event) => {
  if (event.defaultPrevented) return;
  const action = event.target.closest('button[data-action]');
  if (action) {
    const { action: kind } = action.dataset;
    switch (kind) {
      case 'settings':
        openSettings(action);
        break;
      case 'close-settings':
        dialog.close();
        break;
      case 'expand-figure':
        expandFigure(action);
        break;
      case 'close-figure':
        figureDialog.close();
        break;
      case 'check-key':
        void checkKey();
        break;
      case 'delete-key':
        endKeyCheck();
        cancelJob();
        apiKey = '';
        keyField.value = '';
        if (currentResult) render();
        updateKeyState();
        settingsFeedback('APIキーを削除しました。見本公報を検索できます。');
        break;
      case 'example': {
        const field = main.querySelector('#query');
        field.value = action.dataset.word;
        showInputError('');
        field.focus();
        break;
      }
      case 'random':
        startSearch({ random: true, filter: currentFilter() });
        break;
      case 'cancel':
        cancelJob();
        render();
        main.focus({ preventScroll: true });
        break;
      case 'retry':
      case 'sample':
        if (currentResult) startSearch({ ...currentResult, forceSample: kind === 'sample', replace: true });
        break;
      case 'jump': {
        const section = document.getElementById(action.dataset.section);
        section.querySelector('h2').focus({ preventScroll: true });
        section.scrollIntoView();
        break;
      }
    }
    return;
  }

  const anchor = event.target.closest('a');
  if (!anchor || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  if (anchor.classList.contains('skip-link')) {
    event.preventDefault();
    main.focus();
    main.scrollIntoView();
    return;
  }
  const destination = anchor.dataset.route;
  if (!destination) return;
  event.preventDefault();

  let returnTo;
  if (destination.startsWith('/publication/')) {
    if (currentPath.startsWith('/publication/')) {
      returnTo = history.state?.returnTo;
    } else {
      const label = currentResult ? '検索結果' : INFO_TITLES.get(readRoute().pathname.split('/')[2]);
      if (label) returnTo = { path: currentPath, label, scrollY: window.scrollY };
    }
  }
  const prior = history.state?.returnTo;
  const scrollY = anchor.hasAttribute('data-restore-list') && prior?.path === destination ? prior.scrollY : 0;
  navigate(destination, { returnTo, scrollY: scrollY ?? 0, replace: destination === currentPath });
});

history.scrollRestoration = 'manual';
window.addEventListener('popstate', () => {
  render();
  focusView(history.state?.scrollY ?? 0);
});
window.addEventListener('pagehide', () => {
  apiKey = '';
  keyField.value = '';
  endKeyCheck();
  cancelJob();
});
window.addEventListener('pageshow', (event) => {
  if (event.persisted) render();
});

shell();
render();

})();
</script>
</body>
</html>
